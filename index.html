<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>눈 깜빡임</title>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{
      min-height:100dvh;display:flex;align-items:flex-start;justify-content:center;
      background:#f0f0f0;font-family:sans-serif;padding:24px;gap:16px;flex-wrap:wrap;
    }
    #canvas{
      width:500px;height:500px;
      border:2px solid #222;border-radius:32px;
      background:#fff;display:block;flex-shrink:0;
    }
    .panel{
      width:220px;background:#fff;border:1px solid #ddd;border-radius:12px;
      padding:14px 12px;display:flex;flex-direction:column;gap:12px;
      box-shadow:0 1px 4px rgba(0,0,0,.07);
      max-height:calc(100dvh - 48px);overflow-y:auto;
    }
    .panel-section{
      display:flex;flex-direction:column;gap:8px;
      padding-bottom:10px;border-bottom:1px solid #eee;
    }
    .panel-section:last-child{border-bottom:none;padding-bottom:0;}
    .sec-title{font-size:10px;font-weight:800;color:#555;letter-spacing:.06em;text-transform:uppercase;}
    .p-group{display:flex;flex-direction:column;gap:3px;}
    .p-label{font-size:10px;color:#999;font-weight:600;}
    .p-btns{display:flex;gap:3px;flex-wrap:wrap;}
    .btn{
      padding:5px 9px;font-size:11px;font-weight:600;
      background:#eee;color:#333;border:1.5px solid #ccc;border-radius:5px;
      cursor:pointer;white-space:nowrap;transition:background .1s;
    }
    .btn:hover{background:#ddd;}
    .btn.on{background:#222;color:#fff;border-color:#222;}
    .play-btn{
      padding:9px;font-size:12px;font-weight:700;
      background:#222;color:#fff;border:none;border-radius:7px;
      cursor:pointer;flex:1;transition:opacity .12s;
    }
    .play-btn:hover{opacity:.75;}
    .play-btn.rst{background:#fff;color:#222;border:1.5px solid #bbb;}
    .play-row{display:flex;gap:6px;}
  </style>
</head>
<body>

<canvas id="canvas" width="500" height="500"></canvas>

<div class="panel">
  <div class="panel-section">
    <div class="sec-title">재생</div>
    <div class="play-row">
      <button class="play-btn" onclick="startAll()">▶ 재생</button>
      <button class="play-btn rst" onclick="resetAll()">↺</button>
    </div>
  </div>
  <div class="panel-section">
    <div class="sec-title">eye_x 개수</div>
    <div class="p-group">
      <span class="p-label">생성 개수</span>
      <div class="p-btns">
        <button class="btn on" id="cnt_r" onclick="setCount('rand')">무작위</button>
        <button class="btn" id="cnt_1" onclick="setCount(1)">1</button>
        <button class="btn" id="cnt_2" onclick="setCount(2)">2</button>
        <button class="btn" id="cnt_3" onclick="setCount(3)">3</button>
        <button class="btn" id="cnt_4" onclick="setCount(4)">4</button>
        <button class="btn" id="cnt_5" onclick="setCount(5)">5</button>
        <button class="btn" id="cnt_6" onclick="setCount(6)">6</button>
        <button class="btn" id="cnt_7" onclick="setCount(7)">7</button>
        <button class="btn" id="cnt_8" onclick="setCount(8)">8</button>
        <button class="btn" id="cnt_9" onclick="setCount(9)">9</button>
      </div>
    </div>
  </div>
  <div class="panel-section">
    <div class="sec-title">등장 방법</div>
    <div class="p-group"><div class="p-btns">
      <button class="btn on" id="sp1" onclick="setSpawn(1)">1 동시</button>
      <button class="btn" id="sp2" onclick="setSpawn(2)">2 무작위</button>
      <button class="btn" id="sp3" onclick="setSpawn(3)">3 순서대로</button>
    </div></div>
  </div>
  <div class="panel-section">
    <div class="sec-title">open 방법</div>
    <div class="p-group"><div class="p-btns">
      <button class="btn on" id="op1" onclick="setOpen(1)">1 동시</button>
      <button class="btn" id="op2" onclick="setOpen(2)">2 무작위</button>
      <button class="btn" id="op3" onclick="setOpen(3)">3 등장 연동</button>
    </div></div>
  </div>
  <div class="panel-section">
    <div class="sec-title">maus</div>
    <div class="p-group"><span class="p-label">등장</span><div class="p-btns">
      <button class="btn on" id="mausOn" onclick="setMaus(true)">ON</button>
      <button class="btn" id="mausOff" onclick="setMaus(false)">OFF</button>
    </div></div>
    <div class="p-group" id="mausTypeGroup"><span class="p-label">모양</span><div class="p-btns">
      <button class="btn on" id="mt_r" onclick="setMausType('rand')">무작위</button>
      <button class="btn" id="mt_A" onclick="setMausType('A')">A 뾰족</button>
      <button class="btn" id="mt_B" onclick="setMausType('B')">B 둥근</button>
    </div></div>
    <div class="p-group" id="mausThickGroup"><span class="p-label">두께</span><div class="p-btns">
      <button class="btn on" id="mth_r" onclick="setMausThick('rand')">무작위</button>
      <button class="btn" id="mth_0" onclick="setMausThick(0)">균일</button>
      <button class="btn" id="mth_1" onclick="setMausThick(1)">역볼록</button>
      <button class="btn" id="mth_2" onclick="setMausThick(2)">sine</button>
      <button class="btn" id="mth_3" onclick="setMausThick(3)">직선</button>
    </div></div>
  </div>
  <div class="panel-section">
    <div class="sec-title">eye</div>
    <div class="p-group"><span class="p-label">모양</span><div class="p-btns">
      <button class="btn on" id="et_r" onclick="setEyeType('rand')">무작위</button>
      <button class="btn" id="et_A" onclick="setEyeType('A')">A 뾰족</button>
      <button class="btn" id="et_B" onclick="setEyeType('B')">B 둥근</button>
    </div></div>
    <div class="p-group"><span class="p-label">동공 크기</span><div class="p-btns">
      <button class="btn on" id="hr_r" onclick="setHoleRatio('rand')">무작위</button>
      <button class="btn" id="hr_1_3" onclick="setHoleRatio(1/3)">소 1/3</button>
      <button class="btn" id="hr_1_2" onclick="setHoleRatio(1/2)">중 1/2</button>
      <button class="btn" id="hr_2_3" onclick="setHoleRatio(2/3)">대 2/3</button>
    </div></div>
  </div>
</div>


<!-- ================================================================
     외부 스크립트 로드 순서
     반드시 이 순서를 지켜야 합니다.
     각 파일이 이전 파일에서 선언된 변수·함수를 참조하기 때문입니다.

     1. constants.js — 전역 상수 + 전역 상태 변수 (모든 파일이 참조)
     2. ui.js        — UI 버튼 토글 헬퍼 (constants 참조)
     3. math.js      — 수학 유틸 + 공간 판정 (constants 참조)
     4. build.js     — 데이터 빌드 (constants, math, ui 참조)
     5. draw.js      — 캔버스 그리기 헬퍼 (constants 참조)
     6. animate.js   — 렌더 루프 + 진입점 (모든 파일 참조)
================================================================ -->

<script src="js/constants.js"></script>
<script src="js/ui.js"></script>
<script src="js/math.js"></script>
<script src="js/build.js"></script>
<script src="js/draw.js"></script>
<script src="js/animate.js"></script>
</body>
</html>
